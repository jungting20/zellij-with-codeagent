[package]
name = "agent-dashboard-sidebar"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "agent_dashboard_sidebar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
zellij-tile = "=0.44.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
