version: 1
agent: cursor
rules:
  - id: write_file_approval
    priority: 320
    state: blocked
    region: {type: bottom_non_empty_lines, lines: 8}
    match:
      all:
        - contains: ["write to this file?"]
        - contains: ["proceed (y)"]
        - any:
            - contains: ["reject & propose changes"]
            - contains: ["esc or n or p"]
            - contains: ["add write("]
    visible_blocker: true

  - id: approval_prompt
    priority: 300
    state: blocked
    region: {type: whole_recent}
    match:
      any:
        - all:
            - contains: ["waiting for approval", "run this command?"]
            - any:
                - contains: ["run (once) (y)"]
                - contains: ["skip (esc or n)"]
        - contains: ["(y) (enter)"]
        - line_regex: ['(?i)^[[:space:]]*allow .*\(y\)']
        - contains: ["keep (n)"]
        - contains: ["skip (esc or n)"]
        - line_regex: ['(?i)^[[:space:]]*(run |.*\(y\).*(allow|run \(once\)|→ run))']
    visible_blocker: true

  - id: stop_hint_working
    priority: 100
    state: working
    region: {type: bottom_non_empty_lines, lines: 6}
    match: {contains: ["ctrl+c to stop"]}
    visible_working: true

  - id: background_task_status_working
    priority: 95
    state: working
    region: {type: bottom_non_empty_lines, lines: 5}
    match:
      line_regex: ['(?i)\b[1-9][0-9]*[[:space:]]+background[[:space:]]+tasks?\b']
    visible_working: true

  - id: spinner_working
    priority: 90
    state: working
    region: {type: bottom_non_empty_lines, lines: 8}
    match:
      line_regex: ['^[[:space:]]*(⬡|⬢|[\x{2800}-\x{28FF}]+)[[:space:]]+[A-Za-z]+\w*ing\b']
    visible_working: true
