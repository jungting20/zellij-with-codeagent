version: 1
agent: claude
rules:
  - id: osc_title_working
    priority: 1100
    state: working
    region: {type: osc_title}
    match:
      regex: ['^[\x{2800}-\x{28FF}] ']
    visible_working: true

  - id: transcript_viewer
    priority: 1000
    region: {type: bottom_non_empty_lines, lines: 3}
    match:
      all:
        - contains: ["showing detailed transcript"]
        - any:
            - contains: ["ctrl+o", "to toggle"]
            - contains: ["ctrl+e", "show all"]
            - contains: ["ctrl+e", "collapse"]
            - contains: ["↑↓ scroll"]
            - contains: ["? for shortcuts"]
    skip_state_update: true

  - id: live_blocked_form
    priority: 980
    state: blocked
    region: {type: after_last_horizontal_rule}
    match:
      all:
        - contains: ["enter to select", "esc to cancel"]
        - any:
            - contains: ["tab/arrow keys to navigate"]
            - contains: ["arrow keys to navigate"]
            - contains: ["arrows to navigate"]
            - contains: ["↑/↓ to navigate"]
            - contains: ["↑↓ to navigate"]
    visible_blocker: true

  - id: dynamic_workflow_prompt
    priority: 980
    state: blocked
    region: {type: whole_recent}
    match:
      contains: ["run a dynamic workflow?", "esc to cancel"]
    visible_blocker: true

  - id: btw_overlay_working
    priority: 975
    state: working
    region: {type: bottom_non_empty_lines, lines: 5}
    match:
      line_regex:
        - '^[[:space:]]*\/btw([[:space:]]|$)'
        - '(?i)esc to close[[:space:]]*$'
    visible_working: true

  - id: live_prompt_box
    priority: 950
    state: idle
    region: {type: prompt_box_body}
    match:
      all:
        - line_regex: ['^[[:space:]│]*❯']
        - not:
            - contains: ["enter to select"]
            - contains: ["esc to cancel"]
            - contains: ["tab/arrow keys"]
            - contains: ["arrow keys to navigate"]
            - contains: ["↑/↓ to navigate"]
    visible_idle: true

  - id: model_picker_menu
    priority: 900
    region: {type: whole_recent}
    match:
      all:
        - contains: ["select model", "enter to set as default", "esc to cancel"]
        - not:
            - contains: ["do you want to proceed?"]
            - contains: ["enter to select"]
    skip_state_update: true

  - id: bash_permission_prompt
    priority: 850
    state: blocked
    region: {type: whole_recent}
    match:
      all:
        - contains: ["do you want to proceed?"]
        - any:
            - contains: ["bash command"]
            - contains: ["bash("]
            - contains: ["contains expansion"]
            - contains: ["tab to amend"]
            - contains: ["ctrl+e to explain"]
        - any:
            - line_regex: ['(?i)^[[:space:]]*❯?[[:space:]]*yes\b']
            - line_regex: ['(?i)^[[:space:]]*1\.[[:space:]]*yes\b']
            - line_regex: ['(?i)^[[:space:]]*2\.[[:space:]]*no\b']
    visible_blocker: true

  - id: generic_permission_prompt
    priority: 840
    state: blocked
    region: {type: after_last_horizontal_rule}
    match:
      all:
        - contains: ["do you want to proceed?", "esc to cancel"]
        - any:
            - line_regex: ['(?i)^[[:space:]]*❯?[[:space:]]*1\.[[:space:]]*yes\b']
            - line_regex: ['(?i)^[[:space:]]*2\.[[:space:]]*yes\b']
            - line_regex: ['(?i)^[[:space:]]*2\.[[:space:]]*no\b']
            - line_regex: ['(?i)^[[:space:]]*3\.[[:space:]]*no\b']
    visible_blocker: true

  - id: legacy_no_prompt_blocker
    priority: 300
    state: blocked
    region: {type: whole_recent}
    match:
      all:
        - any:
            - all:
                - contains: ["do you want to"]
                - any:
                    - contains: ["yes"]
                    - contains: ["❯"]
            - all:
                - contains: ["would you like to"]
                - any:
                    - contains: ["yes"]
                    - contains: ["❯"]
            - contains: ["waiting for permission"]
            - contains: ["do you want to allow this connection?"]
            - contains: ["tab to amend"]
            - contains: ["ctrl+e to explain"]
            - contains: ["do you want to proceed?", "esc to cancel"]
            - contains: ["review your answers"]
            - contains: ["skip interview and plan immediately"]
        - not:
            - regex: ['(?m)^[[:space:]]*❯[[:space:]]*$']

  - id: osc_title_idle
    priority: 250
    state: idle
    region: {type: osc_title}
    match:
      regex: ['^✳ ']
    visible_idle: true

  - id: osc_progress_idle
    priority: 250
    state: idle
    region: {type: osc_progress}
    match:
      regex: ['^4;0']
